name: Daily Update

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market-terminal
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest FRED series
        run: python -m app.ingestion.fred

      - name: Ingest equities
        run: python -m app.ingestion.equities

      - name: Ingest Hugging Face model snapshot
        run: python -m app.ingestion.huggingface

      - name: Ingest SEC financials
        run: python -m app.ingestion.sec_financials

      - name: Calculate rates signals
        run: python -m app.signals.rates

      - name: Calculate hyperscaler signals
        run: python -m app.signals.hyperscaler
